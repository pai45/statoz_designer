name: Deploy landing to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - landing/**
      - public/assets/brand/logo.png
      - public/assets/library/stadium.png
      - src/app/fonts/onest-latin-variable.woff2
      - src/app/fonts/orbitron-latin-variable.woff2
      - src/design-system/styles/tokens.css
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static landing
        run: |
          mkdir -p _site/assets
          cp landing/index.html _site/index.html
          cp landing/favicon.svg _site/favicon.svg
          cp public/assets/brand/logo.png _site/assets/logo.png
          cp public/assets/library/stadium.png _site/assets/stadium.png
          cp src/app/fonts/onest-latin-variable.woff2 _site/assets/onest-latin-variable.woff2
          cp src/app/fonts/orbitron-latin-variable.woff2 _site/assets/orbitron-latin-variable.woff2
          cp src/design-system/styles/tokens.css _site/assets/statoz-tokens.css
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
