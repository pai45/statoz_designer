<!doctype html>
<html><head><meta charset="utf-8"><title>StatOz video scene</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:var(--ds-color-background-primary);color:var(--ds-color-text-default);font-family:Onest,sans-serif}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(ellipse at 75% 35%,var(--ds-color-background-elevated),transparent 65%)}
.halo{position:absolute;width:110vmin;height:110vmin;border:1px solid var(--ds-color-accent-cyan);border-radius:50%;left:45%;top:10%;opacity:.15}
.halo.second{width:80vmin;height:80vmin;opacity:.08}
#brand{position:absolute;display:flex;align-items:center;gap:2vmin;font-family:Orbitron,sans-serif;font-size:4vmin;font-weight:750;letter-spacing:.04em}
#logo{width:9vmin;height:9vmin;object-fit:contain}
#content{position:absolute;display:flex;flex-direction:column;justify-content:center;gap:4vmin}
.eyebrow{color:var(--ds-color-accent-cyan);font-size:2.6vmin;font-weight:650;letter-spacing:.14em;text-transform:uppercase}
h1{font-family:Orbitron,sans-serif;font-size:9vmin;line-height:1.1;letter-spacing:-.025em;margin:0;max-width:100%;overflow-wrap:break-word}
p{font-size:3.8vmin;line-height:1.45;margin:0;color:var(--ds-color-text-subtle);max-width:100%}
#plate{position:absolute;border:1px solid var(--ds-color-accent-cyan);background:linear-gradient(145deg,var(--ds-color-background-elevated),var(--ds-color-background-secondary));border-radius:3vmin;overflow:hidden;box-shadow:0 3vmin 8vmin #0006}
#hero{width:100%;height:100%;object-fit:contain;display:none}
#symbol{display:flex;align-items:center;justify-content:center;height:100%;font-family:Orbitron,sans-serif;font-weight:900;font-size:18vmin;color:var(--ds-color-accent-cyan)}
#cta{display:inline-block;align-self:flex-start;background:var(--ds-color-accent-cyan);color:var(--ds-color-text-inverse);font-size:3.3vmin;font-weight:750;padding:2.3vmin 3.2vmin;border-radius:1vmin}
#progress{position:absolute;height:.45vmin;background:var(--ds-color-accent-cyan);transform-origin:left center}
</style></head><body>
<div id="stage"><div class="halo"></div><div class="halo second"></div>
<div id="brand"><img id="logo" alt=""><span>StatOz</span></div>
<div id="content"><div class="eyebrow" id="label"></div><h1 id="headline"></h1><p id="body"></p><div id="cta">Explore StatOz</div></div>
<div id="plate"><img id="hero" alt="StatOz feature"><div id="symbol">Oz</div></div><div id="progress"></div></div>
<script>
const scene = /*__STATOZ_SCENE_DATA__*/;
for (const [name,value] of Object.entries(scene.brand.colors)) document.documentElement.style.setProperty(name,value);
const fontStyle=document.createElement('style');
fontStyle.textContent=`@font-face{font-family:Onest;src:url("${scene.brand.fonts.onest}");font-weight:100 900;font-display:block}@font-face{font-family:Orbitron;src:url("${scene.brand.fonts.orbitron}");font-weight:400 900;font-display:block}`;
document.head.append(fontStyle);
const el=id=>document.getElementById(id);
el('logo').src=scene.brand.logo;
if(scene.assets.hero){el('hero').src=scene.assets.hero;el('hero').style.display='block';el('symbol').style.display='none'}
else el('hero').remove();
const portrait=scene.height>scene.width*1.2;
const social=scene.height/scene.width>1.6;
const left=.08*scene.width,right=(social?.14:.08)*scene.width;
const safeTop=(social?.14:.08)*scene.height,safeBottom=(social?.22:.08)*scene.height;
const usableW=scene.width-left-right,usableH=scene.height-safeTop-safeBottom;
Object.assign(el('brand').style,{left:left+'px',top:safeTop+'px'});
const min=Math.min(scene.width,scene.height);
if(portrait){
 Object.assign(el('content').style,{left:left+'px',top:(safeTop+min*.16)+'px',width:usableW+'px',height:usableH*.46+'px'});
 Object.assign(el('plate').style,{left:left+'px',top:(safeTop+usableH*.64)+'px',width:usableW+'px',height:usableH*.32+'px'});
 el('headline').style.fontSize='8vmin';el('body').style.fontSize='4vmin';
}else{
 Object.assign(el('content').style,{left:left+'px',top:(safeTop+min*.15)+'px',width:usableW*.55+'px',height:(usableH-min*.16)+'px'});
 Object.assign(el('plate').style,{left:(left+usableW*.63)+'px',top:(safeTop+usableH*.27)+'px',width:usableW*.37+'px',height:usableH*.60+'px'});
 if(scene.width===scene.height){el('headline').style.fontSize='6vmin';el('body').style.fontSize='3.1vmin'}
}
Object.assign(el('progress').style,{left:left+'px',bottom:safeBottom+'px',width:usableW+'px'});
// Replace these beats with the actual brief; avoid unsupported feature claims.
const beats=[
 {label:'For the fans',headline:'Your next play.',body:'Step into the world of StatOz.'},
 {label:'Discover StatOz',headline:'Get closer.',body:'A fresh perspective on the sports you follow.'},
 {label:'Make it yours',headline:'Stay in the game.',body:'Your passion. Your perspective.'},
 {label:'StatOz',headline:'Ready to play?',body:'Discover what comes next.'}
];
const ease=x=>1-Math.pow(1-Math.max(0,Math.min(1,x)),3);
window.ready=document.fonts.ready;
window.drawFrame=({time,progress})=>{
 const section=Math.min(3,Math.floor(progress*4));
 const local=progress===1?1:progress*4-section;
 const enter=section===0?1:ease(local/.15);
 const exit=section===3?1:1-ease((local-.88)/.12);
 const beat=beats[section];
 el('label').textContent=beat.label;el('headline').textContent=beat.headline;el('body').textContent=beat.body;
 el('content').style.opacity=String(enter*exit);
 el('content').style.transform=`translateY(${(1-enter)*3}vmin)`;
 el('plate').style.transform=`perspective(1200px) rotateY(${Math.sin(time*.5)*4}deg) translateY(${Math.sin(time*.8)*.7}vmin)`;
 el('cta').style.display=section===3?'inline-block':'none';
 el('progress').style.transform=`scaleX(${progress})`;
 document.querySelectorAll('.halo').forEach((node,i)=>node.style.transform=`translate(-50%,-20%) scale(${1+Math.sin(time*.4+i)*.05})`);
};
</script></body></html>
